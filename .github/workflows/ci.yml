name: ci

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-memfill:
    name: Build memfill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: actions-rust-lang/setup-rust-toolchain@1780873c7b576612439a134613cc4cc74ce5538c

      - name: Build
        run: |
          RUSTFLAGS=-AWarnings cargo install cross --git https://github.com/cross-rs/cross --locked
          make build

      - name: Verify GLIBC requirement (<= 2.28 for RHEL 8 support)
        run: |
          ./scripts/check-glibc.sh 2.28 \
            target/x86_64-unknown-linux-gnu/release/memfill \
            target/aarch64-unknown-linux-gnu/release/memfill

      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          cp ./target/x86_64-unknown-linux-gnu/release/memfill ./target/memfill.amd64
          cp ./target/aarch64-unknown-linux-gnu/release/memfill ./target/memfill.arm64
          cp ./target/x86_64-pc-windows-gnu/release/memfill.exe ./target/memfill.exe

      - name: Publish GH Release
        uses: ncipollo/release-action@b7eabc95ff50cbeeedec83973935c8f306dfcd0b
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: memfill ${{ github.ref_name }}
          artifacts: "target/memfill.amd64,target/memfill.arm64,target/memfill.exe,LICENSE"
          generateReleaseNotes: true
